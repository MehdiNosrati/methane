name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, Typecheck, Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages & apps
        run: pnpm build

      - name: Verify custom-elements.json & codegen are up to date
        run: |
          git diff --exit-code -- '**/custom-elements.json'
          test -z "$(git status --porcelain -- '**/custom-elements.json')"
          pnpm run codegen:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit & Integration Tests
        run: pnpm test

      - name: Install Playwright Chromium & WebKit
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Browser E2E (Components, ADR-010 Modern/Fallback, SSR Hydration, Docs QA)
        run: pnpm test:e2e
