name: Release & Provenance Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run publish in --dry-run mode without pushing to npm'
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write

env:
  NPM_CONFIG_PROVENANCE: 'true'

jobs:
  release:
    name: Verify, Budget Check & Publish (@methane-ui/*)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Verify git tag matches package versions
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$TAG_VERSION" ] || [ "$TAG_VERSION" = "$GITHUB_REF_NAME" ]; then
            echo "Invalid release tag: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          METHANE_EXPECTED_VERSION="$TAG_VERSION" node --input-type=module -e "
            import { auditWorkspacePackages } from './tooling/security-gate/dist/index.js';
            const res = auditWorkspacePackages({ expectedVersion: process.env.METHANE_EXPECTED_VERSION });
            if (!res.passed) {
              console.error(JSON.stringify(res.violations, null, 2));
              process.exit(1);
            }
            console.log('Verified ' + res.publishableCount + ' publishable packages match tag v' + process.env.METHANE_EXPECTED_VERSION);
          "

      - name: Verify custom-elements.json & codegen are up to date
        run: |
          git diff --exit-code -- '**/custom-elements.json'
          test -z "$(git status --porcelain -- '**/custom-elements.json')"
          pnpm run codegen:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test (including security & license gates)
        run: pnpm test

      - name: Install Playwright Browsers (Chromium & WebKit)
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Browser E2E (Components, ADR-010 Modern/Fallback, SSR Hydration, Docs QA)
        run: pnpm test:e2e

      - name: Bundle budget check (@methane-ui/bundle-budget)
        run: |
          node --input-type=module -e "
            import { checkBundleBudgets } from './tooling/bundle-budget/dist/index.js';
            const report = await checkBundleBudgets([
              { name: '@methane-ui/sanitize', entryPoint: './packages/sanitize/dist/index.js' },
              { name: '@methane-ui/core', entryPoint: './packages/core/dist/index.js' },
              { name: '@methane-ui/primitives', entryPoint: './packages/primitives/dist/index.js' },
            ]);
            console.log(report.markdown);
            if (!report.passed) process.exit(1);
          "

      - name: Publish @methane-ui/* packages with Sigstore provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ] && [ -n "${NPM_CONFIG_USERCONFIG:-}" ] && [ -f "$NPM_CONFIG_USERCONFIG" ]; then
            sed -i '/_authToken=/d' "$NPM_CONFIG_USERCONFIG"
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            unset NPM_CONFIG_PROVENANCE
            pnpm -r --filter "./packages/**" --filter "./tooling/*" --no-git-checks publish --provenance --access public --dry-run
          else
            if [ -z "$NODE_AUTH_TOKEN" ]; then
              npm install -g npm@latest
            fi
            pnpm -r --filter "./packages/**" --filter "./tooling/*" --no-git-checks publish --provenance --access public
          fi

      - name: Create GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/v') && inputs.dry_run != true }}
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
